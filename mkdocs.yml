# Project Information
site_name: PIQUE
site_url: https://MSUSEL.github.io/Pique-Lite/

# Repository
repo_name: MSUSEL/Pique-Lite
repo_url: https://github.com/MSUSEL/Pique-Lite

# Configuration
theme:
  name: material
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  font:
    text: Roboto
    code: Roboto Mono
  logo: https://raw.githubusercontent.com/MSUSEL/msusel-pique-visualizer/refactorZiyi/src/assets/PIQUE_svg.svg
  language: en
  palette:
    # Dark Mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Dark mode

    # Light Mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Light mode

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Page tree
nav:
  - Home: index.md
  - Overview:
    - Introduction: overview/introduction.md
    - Quick Start: overview/quick-start.md
  - Developer Tools:
    - System Requirements: developer-tools/system-requirements.md
    - Installation: developer-tools/installation.md
  - User Guide: 
    - "Input Schema":
      - test: user-guide/input-schema/input.md
    - "Core Features":
      - test: user-guide/core-features/core.md
    - "Advanced Features":
      - test: user-guide/advanced-features/adv.md
  - Tutorials:
    - Basic Example: tutorials/basic-example.md
    - Advanced Example: tutorials/advanced-example.md
  - Glossary: glossary.md
  - FAQ: faq.md

extra_css:
  - assets/docs-theme.css
